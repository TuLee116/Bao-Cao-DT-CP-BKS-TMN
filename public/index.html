<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý dự án</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Quản lý dự án xây dựng</h1>
    <span id="db-badge" class="badge"></span>
  </header>

  <main>
    <section class="kpis">
      <div class="kpi"><div class="label">Số dự án</div><div class="value" id="k-count">0</div></div>
      <div class="kpi"><div class="label">Tổng giá trị HĐ (VNĐ)</div><div class="value" id="k-hd">0</div></div>
      <div class="kpi"><div class="label">Đã giải ngân (VNĐ)</div><div class="value" id="k-gn">0</div></div>
      <div class="kpi"><div class="label">Tỷ lệ giải ngân</div><div class="value" id="k-tl">0%</div></div>
    </section>

    <section class="card">
      <h2 id="form-title">Thêm dự án</h2>
      <form id="form">
        <input type="hidden" name="id">
        <label>Mã dự án *<input name="ma_du_an" required maxlength="50"></label>
        <label>Tên dự án *<input name="ten_du_an" required maxlength="255"></label>
        <label>Chủ đầu tư<input name="chu_dau_tu" maxlength="255"></label>
        <label>Giá trị HĐ (VNĐ)<input name="gia_tri_hd" type="number" min="0" step="1" value="0"></label>
        <label>Đã giải ngân (VNĐ)<input name="da_giai_ngan" type="number" min="0" step="1" value="0"></label>
        <label>Tiến độ (%)<input name="tien_do" type="number" min="0" max="100" step="0.01" value="0"></label>
        <label>Trạng thái<select name="trang_thai"></select></label>
        <label>Ngày bắt đầu<input name="ngay_bat_dau" type="date"></label>
        <label>Ngày kết thúc<input name="ngay_ket_thuc" type="date"></label>
        <div class="actions">
          <button type="submit" class="primary">Lưu</button>
          <button type="button" id="btn-cancel">Hủy</button>
        </div>
        <div id="msg" class="msg" role="alert"></div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Danh sách dự án</h2>
        <input id="search" type="search" placeholder="Tìm mã, tên, chủ đầu tư...">
        <button id="btn-csv">Xuất CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Mã</th><th>Tên dự án</th><th>Chủ đầu tư</th>
              <th class="num">Giá trị HĐ</th><th class="num">Đã giải ngân</th><th class="num">% GN</th>
              <th>Tiến độ</th><th>Trạng thái</th><th>Thời gian</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
